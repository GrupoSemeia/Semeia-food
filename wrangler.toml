name = "yracema"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "yracema"
# Rode `npx wrangler d1 create yracema` e cole o database_id aqui.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Horário (HH:MM) em que a produção do dia começa: a partir dele o pedido daquela data trava para o gerente.
ORDER_CUTOFF = "06:00"
# Segredo do JWT: defina com `npx wrangler secret put JWT_SECRET`
