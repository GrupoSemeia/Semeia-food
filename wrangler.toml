name = "yracema"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "yracema"
database_id = "5e496d3d-1435-41e6-8631-130ad4643086"
migrations_dir = "migrations"

[vars]
# Horário (HH:MM) em que a produção do dia começa: a partir dele o pedido daquela data trava para o gerente.
ORDER_CUTOFF = "06:00"
# Segredo do JWT: defina com `npx wrangler secret put JWT_SECRET`
